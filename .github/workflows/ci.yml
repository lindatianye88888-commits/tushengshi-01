name: Workflow checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chinese font
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf --output "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
      - name: Check environment and syntax
        run: |
          python -m workflow doctor
          python -m compileall -q workflow
      - name: Validate request schema and example
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/request.schema.json").read_text(encoding="utf-8"))
          example = json.loads(Path("examples/request.example.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(example)
          PY
      - name: Run offline regression checks
        run: python -m unittest discover -s tests -v
